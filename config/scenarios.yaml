config_version: "1.1.0"  # bumped when tier definitions/mappings change; shown in the dashboard Audit Log

# Shock library: event_class x severity tier -> shocks applied to the portfolio.
#
# SOURCED figures come from the Federal Reserve's "2025 November Proposed 2026 Stress Test
# Scenarios" severely-adverse domestic table, extracted 2026-10-04 by directly downloading
# https://www.federalreserve.gov/publications/2025-november-proposed-2026-stress-test-scenarios.htm
# (HTTP 200, reachable directly from this dev machine -- unlike treasury.gov/Yahoo Finance) and
# parsing the embedded HTML <table> with the actual quarter-by-quarter scenario values -- NOT
# relayed through a summarising model. Full table and parse log: docs/DATA_VERIFICATION.md
# section 10. Key quarters used:
#   Q1 2026 (jump-off quarter): 10-yr Treasury 3.2%, BBB yield 7.6%, VIX 58.8
#   Q2 2026: VIX peaks at 72.0 (matches the Board's own prose statement exactly)
#   Q3 2026: BBB yield 8.1%, 10-yr Treasury 2.4% -> BBB-10yr spread = 5.7pp, the peak
#            (matches the Board's own prose "reaching a level of 5.7 percentage points" exactly)
#   Q4 2026: 10-yr Treasury troughs at 2.3% (vs. a 4.3% Q4-2025 jump-off per the Board's prose
#            -- not itself in this table, which starts Q1 2026 -- i.e. a 200bp decline)
#   Baseline (non-stress) VIX, from the adjacent baseline-scenario table: 23.4 (Q1 2026)
# Equity: "Equity prices fall about 54 percent" and house prices -29% / CRE -40% are the Board's
# own stated prescribed declines (prose, cross-checked against the table's Dow Jones/HPI/CRE
# index columns for directional consistency -- see docs/DATA_VERIFICATION.md section 10).
#
# This is the Fed's ONE published severely-adverse scenario -- it is used directly for the
# "fed_severely_adverse" tier below. Every other tier in this file is this project's own
# illustrative assumption, explicitly labelled as such, not a second official scenario.

severity_tiers:
  fed_severely_adverse:
    narrative: "Broad-based U.S. recession (the Fed's own 2026 severely-adverse design): GDP
      contracts and unemployment rises to 10%, triggering a flight-to-quality that pushes long
      Treasury yields DOWN even as credit spreads and equity volatility spike and equities sell
      off sharply."
    source: "SOURCED -- Federal Reserve severely-adverse scenario, see header citation above."
    equity_pct_move: -0.54
    rate_parallel_bp: -200          # 10-yr: 4.3% (Q4'25 jump-off, Board prose) -> 2.3% (Q4'26 trough, table)
    credit_spread_widening_bp:
      investment_grade: 440          # BBB-10yr spread: widens 4.4pp to a 5.7pp peak (table-confirmed, Q3'26)
      high_yield: 650                # ASSUMPTION: the Fed table covers BBB only, not a separate HY series --
                                      # illustrative multiple of the sourced IG figure, not independently sourced.
    vix_peak: 72.0                   # SOURCED -- table-confirmed, Q2 2026, matches Board's own prose exactly
    vix_baseline: 23.4               # SOURCED -- from the adjacent BASELINE scenario table, Q1 2026
    pd_multiplier: 3.0               # ASSUMPTION: illustrative, not a Fed-published PD multiplier

  geopolitical_rate_shock:
    narrative: "Inflationary geopolitical shock (e.g. an energy-supply disruption or trade
      conflict): central banks are forced to tighten into weakening growth, so long rates RISE
      even as risk assets sell off -- the opposite rate direction to a demand-driven recession,
      kept deliberately separate from the Fed scenario above rather than blended with it."
    source: "ASSUMPTION -- the hackathon brief's own stated example scenario, not independently sourced."
    equity_pct_move: -0.10
    rate_parallel_bp: 200
    credit_spread_widening_bp:
      investment_grade: 100
      high_yield: 150
    vix_peak: 30.0
    vix_baseline: 23.4               # SOURCED (same baseline figure as above)
    pd_multiplier: 1.3

  idiosyncratic_credit_event:
    narrative: "Company- or sector-specific credit deterioration (e.g. a ratings downgrade,
      covenant breach, or adverse credit news about one issuer): that name's/sector's credit
      spread blows out and its PD rises sharply, with NO broad market or rate move -- this is
      idiosyncratic, not systemic, which is why it is scoped entity_specific rather than
      portfolio_wide."
    source: "ASSUMPTION -- illustrative, not independently sourced."
    equity_pct_move: -0.15           # applies only to the affected sector/ticker (entity_specific scope)
    rate_parallel_bp: 0              # a single-name event does not move the risk-free curve
    credit_spread_widening_bp:
      investment_grade: 300
      high_yield: 450
    vix_peak: 28.0                   # modest, local vol bump -- not a market-wide VIX spike
    vix_baseline: 23.4
    pd_multiplier: 5.0               # the whole point of a credit event is THIS name's default risk rising sharply

  idiosyncratic_minor:
    narrative: "Lower-severity, firm-specific news (M&A announcement, product launch, routine
      company news): small, scoped-to-entity price moves, no systemic or rate effect."
    source: "ASSUMPTION -- illustrative, not independently sourced."
    equity_pct_move: -0.06
    rate_parallel_bp: 0
    credit_spread_widening_bp:
      investment_grade: 40
      high_yield: 60
    vix_peak: 24.0
    vix_baseline: 23.4
    pd_multiplier: 1.2

# Real-estate-sector-specific overlay (SOURCED, same Fed document): applied as an
# additional equity/collateral shock ONLY to positions tagged sector="Real Estate".
real_estate_overlay:
  house_price_pct_move: -0.29   # SOURCED (Fed severely-adverse scenario, prose)
  cre_price_pct_move: -0.40     # SOURCED (Fed severely-adverse scenario, prose)

# event_class -> which severity tier applies, and whether the shock is portfolio-wide
# (macro/geopolitical) or scoped to exposed counterparties/sectors only (idiosyncratic events).
event_class_mapping:
  Geopolitical:
    tier: geopolitical_rate_shock
    scope: portfolio_wide
  Macroeconomic:
    tier: fed_severely_adverse
    scope: portfolio_wide
  Credit Event:
    tier: idiosyncratic_credit_event
    scope: entity_specific
  Merger/Acquisition:
    tier: idiosyncratic_minor
    scope: entity_specific
  Product Launch:
    tier: idiosyncratic_minor
    scope: entity_specific
  Other:
    tier: idiosyncratic_minor
    scope: entity_specific

# Trigger thresholds (Phase 4.3): impact score above which a stress test fires.
# ASSUMPTION, matching the brief's own example ("Impact Score > 7").
trigger:
  default_impact_threshold: 7.0
  cooldown_hours: 6   # mirrors the signal engine's own novelty cooldown (src/nlp/engine.py)
